[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
materialIcons = "1.7.8"
metro = "1.3.2"
ktor = "3.5.1"
datastore = "1.2.1"
coil = "3.5.0"
materialKolor = "5.0.0-alpha07"
material3 = "1.5.0-alpha04"
googleFonts = "1.11.4"
paging = "3.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
ktor-core = {group ="io.ktor",name = "ktor-client-core",version.ref="ktor"}
ktor-cio ={group ="io.ktor", name= "ktor-client-cio", version.ref = "ktor"}
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
datastore = {group = "androidx.datastore", name="datastore-preferences", version.ref="datastore"}
coil = {group="io.coil-kt.coil3",name="coil-compose", version.ref="coil"}
materialIcons = {group="androidx.compose.material",name="material-icons-core", version.ref="materialIcons"}
materialKolor = {group="com.materialkolor",name="material-kolor", version.ref = "materialKolor"}
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
googleFonts = {group="androidx.compose.ui",name="ui-text-google-fonts",version.ref="googleFonts"}
metro-viewModel = {group="dev.zacsweers.metro",name="metrox-viewmodel",version.ref="metro"}
metro-viewmodel-compose = {group="dev.zacsweers.metro",name="metrox-viewmodel-compose",version.ref="metro"}
paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
metro = {id = "dev.zacsweers.metro", version.ref="metro"}
serialization = {id= "org.jetbrains.kotlin.plugin.serialization", version.ref="kotlin"}

[bundles]
ktor = ["ktor-core","ktor-cio","ktor-okhttp","ktor-content-negotiation","ktor-serialization-json","ktor-logging"]
metro= ["metro-viewModel","metro-viewmodel-compose"]
paging= ["paging-compose","paging-runtime"]

